<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga de Béisbol Infantil - Equipos</title>
    
    <link rel="stylesheet" href="public/css/base.css">
    <link rel="stylesheet" href="public/css/layout.css">
    <link rel="stylesheet" href="public/css/sidebar.css">
    <link rel="stylesheet" href="public/css/components.css">
    <link rel="stylesheet" href="public/css/dashboard.css">
    <link rel="stylesheet" href="public/css/equipos.css">
    <link rel="stylesheet" href="public/css/jugadores.css">
    <link rel="stylesheet" href="public/css/partidos.css">
    <link rel="stylesheet" href="public/css/campo.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="top-bar">
        <div class="logo">
            <i class="fas fa-baseball-bat-ball"></i>
            <span>Gestor de la Liga de Béisbol Infantil</span>
        </div>
    </header>
    
    <div class="main-container">
        <nav class="sidebar">
        <ul>
            <li><a href="index.html"><i class="fas fa-home"></i> Inicio</a></li>
            <li><a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
            <li class="active">
                <a href="equipos.html"><i class="fas fa-users"></i> Equipos</a>
            </li>
            <li><a href="jugadores.html"><i class="fas fa-user-friends"></i> Jugadores</a></li>
            <li><a href="partidos.html"><i class="fas fa-calendar-alt"></i> Partidos</a></li>
            <li><a href="campo.html"><i class="fas fa-map-marker-alt"></i> Campos</a></li>
        </ul>
    </nav>

    <main class="content">
        <h2>Gestión de Equipos</h2>

        <div class="container form-section">
            <header class="content-header">
                <h3 class="titulo-azul"><i class="fas fa-plus-circle"></i> Registrar Nuevo Equipo</h3>
            </header>
            
            <form id="teamForm" class="horizontal-form">
                <div class="form-group">
                    <label for="teamName">Nombre del Equipo:</label>
                    <input type="text" id="teamName" placeholder="Ej. Tigers" required> 
                </div>
                
                <div class="form-group">
                    <label for="teamCategory">Categoría:</label>
                    <select id="teamCategory" required> 
                        <option value="">Selecciona una categoría</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="coachName">Coach:</label>
                    <input type="text" id="coachName" placeholder="Nombre completo" required>
                </div>
                
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Guardar Equipo
                </button>
            </form>
        </div>

        <div class="container table-section">
            <header class="content-header">
                <h3 class="titulo-azul"><i class="fas fa-list"></i> Equipos Registrados</h3>
            </header>

            <div class="table-responsive">
                <table id="teamsTable">
                    <thead>
                        <tr>
                            <th>Nombre del Equipo</th>
                            <th>Categoría</th>
                            <th>Coach Responsable</th>
                            <th>Acciones</th> 
                        </tr>
                    </thead>
                    <tbody id="teamsBody">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="modalEditar" class="modal">
            <div class="modal-content">
                <h3>Editar Equipo</h3>
                
                <input type="hidden" id="editTeamId">
                
                <div class="modal-grid">
                    <div class="form-group">
                        <label>Nombre del Equipo</label>
                        <input type="text" id="editNombre" placeholder="Nombre del equipo">
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="editCategoria"></select>
                    </div>
                    <div class="form-group">
                        <label>Coach Responsable</label>
                        <input type="text" id="editCoach" placeholder="Nombre del coach">
                    </div>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" id="btnGuardarEdicion" class="btn-primary">Guardar cambios</button>
                    <button type="button" class="btn-cancel" onclick="cerrarModalEditar()">Cancelar</button>
                </div>
            </div>
        </div>

</div> 

<script src="public/js/config.js"></script>
<script src="public/js/equipos.js"></script>
</body>
</html>
